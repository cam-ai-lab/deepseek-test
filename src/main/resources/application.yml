spring:
  application:
    name: quotes
  # There is no in-memory database any more. The application runs on the same engine in every
  # environment, so a migration that PostgreSQL rejects cannot pass in tests and fail in production.
  # For local development: `docker compose up -d`, then `./gradlew bootRun`.
  # Tests override these four values with a throwaway container.
  datasource:
    url: jdbc:postgresql://localhost:5432/quotes
    username: quotes
    password: quotes
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only proves the entity mapping still matches it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  rate:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

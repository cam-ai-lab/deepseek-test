# Cucumber reports. The HTML report is what a failure is read in; the JUnit XML is what CI and IDEs
# consume. Kept here rather than in the build file so the report configuration lives beside the
# suite it describes.
cucumber.plugin=pretty, html:build/reports/cucumber/index.html, junit:build/test-results/cucumber.xml

# Scenarios share one WireMock container whose stubs are global, so they must not interleave. When
# the suite is big enough to need it, give each scenario a unique product code and turn this on.
cucumber.execution.parallel.enabled=false

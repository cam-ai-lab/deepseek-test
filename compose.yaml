# Local development database. Tests do not use this: they start their own throwaway container
# with Testcontainers, so a test run never touches whatever is in here.
#
#   docker compose up -d
#   ./gradlew bootRun
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 2s
      timeout: 2s
      retries: 30

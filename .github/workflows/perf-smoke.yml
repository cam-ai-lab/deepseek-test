name: Performance smoke

# Deliberately not on every pull request. These are latency assertions, and a shared CI runner is
# noisy enough that they would fail for reasons unrelated to the change - which trains people to
# ignore them. Nightly gives a stable baseline to compare against, and the manual trigger means
# someone can run it against a branch when they suspect a regression.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gatling:
    name: Gatling smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Provide a docker-compose shim
        # See the note in ci.yml: Testcontainers' local compose mode wants a `docker-compose`
        # executable and the runner only has the Compose v2 plugin.
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'SH'
          #!/bin/sh
          exec docker compose "$@"
          SH
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: Run the smoke simulation
        run: ./gradlew :blackbox:gatlingRun
      - name: Upload the Gatling report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: blackbox/build/reports/gatling/
          if-no-files-found: ignore

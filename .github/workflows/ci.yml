name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run that is already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit, integration and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        # Compiles, then runs every tier except `ephemeral`, then checks coverage.
        run: ./gradlew build
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: ignore

  ephemeral:
    name: Ephemeral infrastructure tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the Testcontainers tier
        # The GitHub runner already has a working Docker daemon.
        run: ./gradlew ephemeralTest
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ephemeral-report
          path: build/reports/tests/ephemeralTest/
          if-no-files-found: ignore

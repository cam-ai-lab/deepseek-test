name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run that is already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        # One job, every tier. The database tests start their own PostgreSQL container via
        # Testcontainers; the GitHub runner already has a working Docker daemon, so there is no
        # separate container job and no Docker-free subset to keep in step.
        run: ./gradlew build
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: ignore
